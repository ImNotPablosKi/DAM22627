<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        const array = [4,0,3,4,7,3,5,8,1,8,8,0,2,3,1,2,5,7,3,2,5,1]

        // La resta es para que JS sepa que debe ordenar de mayor a menor, si no, lo ordenaria como si fuera un texto
        // Por ejemplo, pondría que 10 es menor que 2
        const nuevo = new Set(array.sort((a,b) => a - b)) // El set no permite duplicados

        alert([...nuevo])

    </script>

</head>

</body>
</html>
