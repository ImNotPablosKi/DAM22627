<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWEC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

</head>

<body>

    <div class="container p-5">

        <p>Introduce un DNI</p>
        
        <input type="text" id="texto" onblur="validarFormatoDNI()">
        <br>
        <button class="mt-3 btn btn-primary" onclick="validarFormatoDNI()">Enviar Formulario</button>

    </div>

    <script>
        var textoDni = document.getElementById("texto");

        function validarFormatoDNI() {

            const dniLimpio = textoDni.value.trim().toUpperCase();
            const regexDNI = /^[0-9]{8}[A-Z]$/;

            if (!regexDNI.test(dniLimpio)) {

                alert("DNI INVÁLIDO!");

            }

        }

    </script>

</body>

</html>
