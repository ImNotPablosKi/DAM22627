<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWEC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

</head>

<body>

    <div class="container p-3">

        <p>Introduce un email:</p>
        <input type="email" id="correo">

        <br>

        <button class="btn btn-outline-primary mt-3" type="submit" onclick="validarCorreo()">Enviar Formulario</button>
        <button class="btn btn-danger mt-3">Reset</button>

    </div>

    <script>

        // Lista de servidores que se admiten
        const listaServidores = ["terra.es", "google.com", "marca.es", "yahoo.es"];

        const textoCorreo = document.getElementById("correo");

        function validarCorreo() {
            const correo = textoCorreo.value.trim();

            // Esto no hay que aprendérselo
            const regexCorreo = /^[a-zA-Z][0-9a-zA-Z_]+(\.{1})?[0-9a-zA-Z_]+(\.{1})?[0-9a-zA-Z_]+(\.{1})?[0-9a-zA-Z_]+\@[a-zA-Z_]+\.(com|[a-z]{3})(\.[a-z]{2})?$/;

            // Comprobar que es un formáto normal antes de nada
            if (!regexCorreo.test(correo)) {

                alert("Correo NO VÁLIDO");

            }

            // Separaar el texto por el @ quedarse con la parte del dominio
            // Ejemplo -> juan@terra.es -> ["juan", "terra.es"] -> dominio = "terra.es"
            const dominio = correo.split("@")[1];

            // Comprobar si ese dominio está en el array
            if (listaServidores.includes(dominio)) {

                alert("Correo Y dominio CORRECTOS");

            } else {

                alert("Dominio NO VÁLIDO!");
                
            }
        }


    </script>
</body>

</html>
