<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJ4 v2</title>

    <script>

        let var1 = 4
        let var2 = 2

        let op = parseInt(prompt("Que operacion desea realizar? 1-Sumar, 2-Restar, 3-Multiplicar, 4-Dividir: "))


        switch (op) {

            case 1:

                alert(var1 + " + " + var2 + " = " + var1+var2)

                break
            case 2:

                alert(var1 + " - " + var2 + " = " + var1-var2)

                break
            case 3:

                alert(var1 + " * " + var2 + " = " + var1*var2)

                break
            case 4:

                alert(var1 + " / " + var2 + " = " + var1/var2)

                break
            default:

                alert("bro")

                break
        }

    </script>

</head>
<body>
    
</body>
</html>
