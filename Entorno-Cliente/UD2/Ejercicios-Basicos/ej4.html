<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJ4</title>

    <script>

        let var1 = 9
        let var2 = 7

        let op = prompt("Que operacion desea realizar? 1-Sumar, 2-Restar, 3-Multiplicar, 4-Dividir: ")

        if (op === 1) {

            alert(var1 + " + " + var2 + " = " + var1+var2)

        } else if (op === 2) {

            alert(var1 + " - " + var2 + " = " + var1-var2)


        } else if (op == 3) {

            alert(var1 + " * " + var2 + " = " + var1*var2)

        } else if (op === 4) {

            if (var1 === 0 || var2 === 0) {
                
                alert("No es posible dividir por cero!")
            } else {

                alert(var1 + " / " + var2 + " = " + var1/var2)

            }    

        }

    </script>

</head>
<body>
    
</body>
</html>
