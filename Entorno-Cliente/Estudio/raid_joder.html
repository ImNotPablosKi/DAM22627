<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo RAID</title>
</head>
<body>
    <h1>Calculo RAID</h1>

    <label for="raid">Nivel RAID:</label>
    <select id="raid"></select>

    <label for="discos">Numero de discos:</label>
    <select id="discos"></select>

    <label for="tamanio">Tamaño de los discos:</label>
    <select id="tamanio"></select> TB

    <button id="calcular">Calcular</button>

    <p>Tamaño del conjunto: <span id="resultado">—</span></p>

    <script>
        // ---------- Configuración ----------
        // Mínimo de discos que necesita cada nivel RAID
        const MIN_DISCOS = { 0: 2, 1: 2, 5: 3 };
        const MAX_DISCOS = 8;                    // cámbialo si tu ejercicio usa otro máximo
        const TAMANIOS_TB = [0.5, 1, 1.5, 2];    // de 500 GB a 2 TB

        // ---------- Referencias al DOM ----------
        const selRaid    = document.getElementById("raid");
        const selDiscos  = document.getElementById("discos");
        const selTamanio = document.getElementById("tamanio");
        const boton      = document.getElementById("calcular");
        const resultado  = document.getElementById("resultado");

        // ---------- Rellenar los select ----------
        function rellenarSelect(select, valores) {
            select.innerHTML = "";   // vacía las opciones anteriores
            valores.forEach(valor => {
                const opcion = document.createElement("option");
                opcion.value = valor;
                opcion.textContent = valor;
                select.appendChild(opcion);
            });
        }

        // El número de discos depende del nivel RAID elegido
        function actualizarDiscos() {
            const nivel = Number(selRaid.value);
            const anterior = Number(selDiscos.value);   // para conservar la selección si sigue siendo válida

            const opciones = [];
            for (let n = MIN_DISCOS[nivel]; n <= MAX_DISCOS; n++) {
                opciones.push(n);
            }
            rellenarSelect(selDiscos, opciones);

            if (anterior >= MIN_DISCOS[nivel]) {
                selDiscos.value = anterior;
            }
        }

        rellenarSelect(selRaid, Object.keys(MIN_DISCOS));   // 0, 1, 5
        rellenarSelect(selTamanio, TAMANIOS_TB);
        selTamanio.value = 1;
        actualizarDiscos();

        // ---------- Cálculo ----------
        function calcular() {
            const nivel   = Number(selRaid.value);
            const discos  = Number(selDiscos.value);
            const tamanio = Number(selTamanio.value);   // TB por disco

            let total;
            if (nivel === 0) {
                // RAID 0 (stripe): se suma la capacidad de todos los discos
                total = discos * tamanio;
            } else if (nivel === 1) {
                // RAID 1 (espejo): solo cuenta la capacidad de un disco
                total = tamanio;
            } else {
                // RAID 5 (paridad distribuida): se pierde un disco de capacidad
                total = (discos - 1) * tamanio;
            }

            resultado.textContent = total + " TB";
        }

        boton.addEventListener("click", calcular);

        // Al cambiar el nivel, se ajustan los discos disponibles
        selRaid.addEventListener("change", () => {
            actualizarDiscos();
            resultado.textContent = "—";
        });

        [selDiscos, selTamanio].forEach(sel => {
            sel.addEventListener("change", () => {
                resultado.textContent = "—";
            });
        });
    </script>
</body>
</html>
