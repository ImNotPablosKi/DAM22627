<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="texto"></p>
    <script>
        document.addEventListener("mousemove", mover)

        function mover(e){
            document.getElementById("texto").textContent = `Eje x: ${e.clientX}, eje y: ${e.clientY}`
        }
    </script>
</body>
</html>
