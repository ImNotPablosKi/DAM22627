<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="marcarTodos()">Marcar Todos</button>
    <button onclick="desmarcarTodos()">Desmarcar todo</button>
    <script>
        document.write("<form>")
        for (let i = 0; i < 100; i++) {
            var num = parseInt(Math.random()*100+1)
            document.write(`<input type=\"checkbox\" id=\"check${i}\" class=\"elemento\"">`)
            document.write(`<label for=\"check${i}\">${num}</label>`)
            document.write(`<br>`)
        }
        document.write("</form>")

        document.getElementById("marcar").onclick = () => {
            Array.from(document.getElementsByClassName("elemento")).forEach(e=>{
                e.checked = true
            })
        }

        document.getElementById("desmarcar").onclick = () => {
            Array.from(document.getElementsByClassName("elemento")).forEach(e=>{
                e.checked = false
            })
        }

        function marcarTodos() {
            Array.from(document.getElementsByClassName("elemento")).forEach(e=>{
                e.checked = true
            })
        }

        function desmarcarTodos() {
            Array.from(document.getElementsByClassName("elemento")).forEach(e=>{
                e.checked = false
            })
        }
    </script>
</body>
</html>
