<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    var strings = prompt("Di tu nombre").split(" ")

    strings[strings.length-2]=strings[strings.length-2].concat(",")

    var cad = ""

    strings.forEach(a=>{
        cad = cad.concat(a.concat(" "))
    })

    document.write(cad)
    
</script>
