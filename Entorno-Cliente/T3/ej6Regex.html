<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    var correo = prompt("Dame un correo")

    if(correo.match("^[a-zA-Z_]+@[a-zA-Z_]+\\.\\w{2,}$")){
        cosas = correo.match("^(\\w+)@(\\w+\\.\\w{2,})$")
        document.write(`Nombre de usuario: ${cosas[1]} <br/>`)
        document.write(`Dominio: ${cosas[2]}`)
    } else {
        document.write("Inválido")
    }

</script>

<body>
    
</body>
</html>
