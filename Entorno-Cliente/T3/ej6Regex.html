<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    var correo = prompt("Dame un correo")
    let reg = "^(\\w+)@(\\w+\\.\\w{2,})$"
    if(correo.match(reg)){
        cosas = correo.match(reg)
        document.write(`Nombre de usuario: ${cosas[1]} <br/>`)
        document.write(`Dominio: ${cosas[2]}`)
    } else {
        document.write("Inválido")
    }
</script>

<body>
    
</body>
</html>
