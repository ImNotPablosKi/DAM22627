    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<script>
    var fecha = prompt("Ecribe una fecha dd-mm-aaaa")

    if(fecha.match("^[0-9]{2}-[0-9]{2}-[0-9]{4}$")){
        document.write("Válido")
    } else {
        document.write("No válido")
    }
</script>
