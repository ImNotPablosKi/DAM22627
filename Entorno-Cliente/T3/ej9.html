<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    var cad = prompt("Dame una cadena")
    var cads = cad.split(" ")
    cad = ""
    cads.forEach(a=>{
        cad = cad.concat(a.charAt(0).toUpperCase().concat(a.substring(1).toLowerCase())+" ")
    })
    document.write(cad)
</script>
<body>
    
</body>
</html>
