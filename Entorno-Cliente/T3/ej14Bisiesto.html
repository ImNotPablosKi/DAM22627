<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>

    var fecha = new Date

    var anio = prompt("Que año queires comprobar")
    fecha.setFullYear(anio)
    var es = false

    if(anio%4==0){
        es = true
        if(anio%100==0 && anio%400!=0){
            es = false
        }
    }

                                            // Si "es" es true se usa el indice 0 (Es),
                                            // si es false se usa el indice 1 (No es)
    document.write(`${fecha.getFullYear()} - ${es ? "Es" : "No es"} bisiesto`)

</script>
<body>

</body>
</html>
